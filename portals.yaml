portals:
  # Conteúdo já coberto por TRFDJN via DJEN (comunica_pje, sigla_tribunal:
  # TRF1) — a Fase 19 do PLANO.md confirmou que uma única siglaTribunal=TRF1
  # cobre 1º e 2º grau (ver orgaoJulgador com "Vara Federal"/"Seção
  # Judiciária" e "Gab. NN - DESEMBARGADOR FEDERAL"/"Turma Recursal" nos
  # mesmos resultados). Habilitar os dois duplicaria e-mail (mesma
  # publicação, portal_code diferente → hash diferente no dedupe).
  - code: JFDFDJN
    name: "Diário da Justiça Federal do DF"
    url: "https://trf1.jus.br/trf1/biblioteca/diarios-da-justica"
    adapter: trf1_biblioteca
    engine: playwright
    enabled: false
  - code: TCU
    name: "Diário do TCU"
    url: "https://portal.tcu.gov.br/btcu"
    adapter: tcu
    engine: http
    enabled: true
  - code: TCDF
    name: "Diário do TCDF"
    url: "https://doe.tc.df.gov.br"
    adapter: tcdf
    engine: http
    enabled: true
  - code: STFDJE
    name: "DJe do STF"
    url: "https://digital.stf.jus.br/publico/publicacoes"
    adapter: stf_dje
    engine: playwright
    enabled: false
  - code: STJ
    name: "Diário do STJ"
    url: "https://processo.stj.jus.br/processo/dj/init"
    adapter: stj
    engine: playwright
    enabled: false
  # Desabilitado em 2026-08-17: volume diário (~10-13 mil comunicações,
  # já que o adapter busca "hoje" a cada ciclo, não é backlog único)
  # gera e-mail HTML grande o bastante para estourar o limite de tamanho
  # do servidor SMTP (MailGrid, 552 Message size exceeds maximum) em
  # dias de conteúdo mais longo. Passou raspando num teste, falhou no
  # outro. Precisa de envio em lotes (split por tamanho) no mailer antes
  # de reabilitar — ver TJDFTDJN abaixo, mesmo motivo.
  - code: STJDJN
    name: "STJ no DJEN (Comunica PJe)"
    url: "https://comunica.pje.jus.br/consulta?siglaTribunal=STJ&meio=D"
    adapter: comunica_pje
    engine: http
    params: { sigla_tribunal: STJ }
    enabled: false
  - code: TST
    name: "Diário do TST (JusLaboris)"
    url: "https://juslaboris.tst.jus.br/feed/atom_1.0/site"
    adapter: juslaboris_feed
    engine: http
    enabled: true
  # Desabilitado em 2026-08-17: junto com TRT10DJN/TRFDJN abaixo, o
  # volume combinado (~25-27 mil comunicações/dia) estourou o limite de
  # tamanho do SMTP mesmo com STJDJN/TJDFTDJN já desabilitados. Não é
  # exclusivo dos dois portais originais — qualquer combinação de
  # portais DJEN de volume médio/alto pode estourar. Precisa do envio
  # em lotes no mailer antes de reabilitar.
  - code: TSTDJN
    name: "TST no DJEN (Comunica PJe)"
    url: "https://comunica.pje.jus.br/consulta?siglaTribunal=TST&meio=D"
    adapter: comunica_pje
    engine: http
    params: { sigla_tribunal: TST }
    enabled: false
  - code: TRT10DJN
    name: "TRT 10ª Região no DJEN (Comunica PJe)"
    url: "https://comunica.pje.jus.br/consulta?siglaTribunal=TRT10&meio=D"
    adapter: comunica_pje
    engine: http
    params: { sigla_tribunal: TRT10 }
    enabled: false
  # Desabilitado em 2026-08-17: mesmo motivo do STJDJN acima — e-mail
  # com ~10 mil comunicações do dia estourou o limite de tamanho do
  # SMTP (552 Message size exceeds maximum permitted). Sem perda de
  # dados (rollback automático, sessão não comitou), mas vai repetir
  # todo dia até o mailer suportar envio em lotes.
  - code: TJDFTDJN
    name: "TJDFT no DJEN (Comunica PJe)"
    url: "https://comunica.pje.jus.br/consulta?siglaTribunal=TJDFT&meio=D"
    adapter: comunica_pje
    engine: http
    params: { sigla_tribunal: TJDFT }
    enabled: false
  # Desabilitado em 2026-08-17: mesmo motivo do TSTDJN/TRT10DJN acima —
  # volume combinado dos portais DJEN estourou o limite de tamanho do
  # SMTP. Precisa do envio em lotes no mailer antes de reabilitar.
  - code: TRFDJN
    name: "TRF 1ª Região"
    url: "https://trf1.jus.br/trf1/biblioteca/diarios-da-justica"
    adapter: comunica_pje
    engine: http
    params: { sigla_tribunal: TRF1 }
    enabled: false
  - code: TRF1ATA
    name: "TRF1 Atas de Distribuição"
    url: "https://www.trf1.jus.br/trf1/ataas/atas"
    adapter: trf1_atas
    engine: playwright
    enabled: false